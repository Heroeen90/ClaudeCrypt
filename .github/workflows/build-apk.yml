name: Build Android APK

on:
  push:
    branches:
      - main 

jobs:
  build:
    name: Build APK using Cordova
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # تم تحديث إصدار الجافا إلى 17 هنا
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Cordova Project
        run: |
          cordova create app com.roeen.claudecrypt ClaudeCrypt
          rm -rf app/www/*
          rsync -av --exclude='app' --exclude='.github' . app/www/
          cd app
          cordova platform add android
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeCrypt-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
