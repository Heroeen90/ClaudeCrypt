name: Build Android APK

# هذا الأمر يخبر GitHub بتشغيل البناء عند أي تحديث في فرع main
on:
  push:
    branches:
      - main # إذا كان الفرع الرئيسي لديك اسمه master، قم بتغيير هذه الكلمة

jobs:
  build:
    name: Build APK using Cordova
    runs-on: ubuntu-latest

    steps:
      # 1. سحب كود المشروع من المستودع
      - name: Checkout source code
        uses: actions/checkout@v3

      # 2. إعداد بيئة Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 3. إعداد بيئة Java (ضرورية لبرمجة الأندرويد)
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      # 4. تثبيت Cordova
      - name: Install Cordova
        run: npm install -g cordova

      # 5. إنشاء تطبيق الأندرويد وتغليف الملفات
      - name: Build Cordova Project
        run: |
          # إنشاء مشروع كوردوفا جديد
          cordova create app com.roeen.claudecrypt ClaudeCrypt
          
          # حذف الملفات الافتراضية
          rm -rf app/www/*
          
          # نسخ ملفات مشروعك (index, css, js...) إلى داخل مجلد التطبيق
          rsync -av --exclude='app' --exclude='.github' . app/www/
          
          # الدخول للمجلد وبناء الأندرويد
          cd app
          cordova platform add android
          cordova build android

      # 6. رفع ملف الـ APK النهائي لتتمكن من تحميله
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: ClaudeCrypt-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
