name: Build Android APK

on:
  push:
    branches:
      - main 

jobs:
  build:
    name: Build APK using Cordova
    runs-on: ubuntu-latest

    steps:
      # 1. سحب كود المشروع (تحديث إلى v4)
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Node.js (تحديث إلى v4)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3. إعداد بيئة Java (تحديث إلى v4)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      # 4. تثبيت Cordova
      - name: Install Cordova
        run: npm install -g cordova

      # 5. إنشاء تطبيق الأندرويد وتغليف الملفات
      - name: Build Cordova Project
        run: |
          cordova create app com.roeen.claudecrypt ClaudeCrypt
          rm -rf app/www/*
          rsync -av --exclude='app' --exclude='.github' . app/www/
          cd app
          cordova platform add android
          cordova build android

      # 6. رفع ملف الـ APK النهائي (تحديث إلى v4 - هذا هو الذي تسبب بالخطأ)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeCrypt-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
